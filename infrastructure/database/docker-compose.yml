version: "3.8"

services:
  postgres:
    build: .
    container_name: multi_db_postgres_2
    environment:
      POSTGRES_USER: khoidev
      POSTGRES_PASSWORD: khoicktv
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # Use named volume for better cross-platform compatibility (Windows & Linux)
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khoidev"]
      interval: 10s
      timeout: 5s
      retries: 5

# Named volume - works consistently on both Windows and Ubuntu
volumes:
  postgres_data:
    driver: local
