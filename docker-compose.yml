version: "3.9"

services:
  # ==================== INFRASTRUCTURE ====================

  # PostgreSQL Database (4 databases)
  postgres:
    build: ./infrastructure/database
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-khoidev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-khoicktv}
      POSTGRES_DB: postgres
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-khoidev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgAdmin - PostgreSQL Administration Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ecommerce.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # Re-import servers.json on every start (not just first-ever boot of the
      # pgadmin_data volume), so this also takes effect for volumes that already
      # existed before auto-registration was added, and picks up future edits.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "5480:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Auto-registers the postgres server (and all its databases) - no manual
      # "Register Server" click needed. You'll still be prompted for the DB
      # password the first time you expand/connect to it each session.
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - ecommerce-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Kafka Broker
  kafka:
    image: apache/kafka:4.2.1-rc3
    container_name: ecommerce_kafka
    user: root
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka Topic Initialization
  kafka-init:
    image: apache/kafka:4.2.1-rc3
    container_name: ecommerce_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/init-kafka.sh:/tmp/init-kafka.sh
    command: ["/bin/bash", "-c", "tr -d '\\r' < /tmp/init-kafka.sh > /tmp/init-kafka-clean.sh && /bin/bash /tmp/init-kafka-clean.sh"]
    networks:
      - ecommerce-network

  # Kafka UI (Optional - for monitoring)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecommerce_kafka_ui
    ports:
      - "9280:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "ecommerce-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      - kafka
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ==================== MICROSERVICES ====================

  # Identity Service (Port 9000)
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile.local
    container_name: identity-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-khoidev}
      DB_PASSWORD: ${DB_PASSWORD:-khoicktv}
      # Kafka
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      # Cloudflare R2
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      # Inter-service REST
      BACK_OFFICE_HOST: back-office-service
      BACK_OFFICE_PORT: 9100
      PRODUCT_STORAGE_HOST: product-storage-service
      PRODUCT_STORAGE_PORT: 9200
      ECOMMERCE_HOST: ecommerce-service
      ECOMMERCE_PORT: 9300
    ports:
      - "9000:9000"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure

  # Back-Office Service (Port 9100)
  back-office-service:
    build:
      context: ./services/back-office-service
      dockerfile: Dockerfile.local
    container_name: back-office-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-khoidev}
      DB_PASSWORD: ${DB_PASSWORD:-khoicktv}
      # Kafka
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      # Cloudflare R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      USER_AVATAR_PUBLIC_BUCKET_URL: ${USER_AVATAR_PUBLIC_BUCKET_URL:-https://pub-954e99f131cf4cc896de1ad360338682.r2.dev}
      # Inter-service REST
      IDENTITY_HOST: identity-service
      IDENTITY_PORT: 9000
      PRODUCT_STORAGE_HOST: product-storage-service
      PRODUCT_STORAGE_PORT: 9200
      ECOMMERCE_HOST: ecommerce-service
      ECOMMERCE_PORT: 9300
    ports:
      - "9100:9100"
    networks:
      - ecommerce-network
    restart: on-failure

  # Product Storage Service (Port 9200)
  product-storage-service:
    build:
      context: ./services/product_storage_service
      dockerfile: Dockerfile.local
    container_name: product-storage-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-khoidev}
      DB_PASSWORD: ${DB_PASSWORD:-khoicktv}
      # Kafka
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      # Cloudflare R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      USER_AVATAR_PUBLIC_BUCKET_URL: ${USER_AVATAR_PUBLIC_BUCKET_URL:-https://pub-954e99f131cf4cc896de1ad360338682.r2.dev}
      # Inter-service REST
      IDENTITY_HOST: identity-service
      IDENTITY_PORT: 9000
      BACK_OFFICE_HOST: back-office-service
      BACK_OFFICE_PORT: 9100
      ECOMMERCE_HOST: ecommerce-service
      ECOMMERCE_PORT: 9300
    ports:
      - "9200:9200"
    networks:
      - ecommerce-network
    restart: on-failure

  # Ecommerce Service (Port 9300)
  ecommerce-service:
    build:
      context: ./services/ecommerce-service
      dockerfile: Dockerfile.local
    container_name: ecommerce-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      product-storage-service:
        condition: service_started
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-khoidev}
      DB_PASSWORD: ${DB_PASSWORD:-khoicktv}
      # Kafka
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      # Cloudflare R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      USER_AVATAR_PUBLIC_BUCKET_URL: ${USER_AVATAR_PUBLIC_BUCKET_URL:-https://pub-954e99f131cf4cc896de1ad360338682.r2.dev}
      GOONG_API_KEY: ${GOONG_API_KEY}
      # Inter-service REST
      IDENTITY_HOST: identity-service
      IDENTITY_PORT: 9000
      BACK_OFFICE_HOST: back-office-service
      BACK_OFFICE_PORT: 9100
      PRODUCT_STORAGE_HOST: product-storage-service
      PRODUCT_STORAGE_PORT: 9200
    ports:
      - "9300:9300"
    networks:
      - ecommerce-network
    restart: on-failure

  # ==================== SEARCH & CHAT ====================

  # Elasticsearch - for search-chat-service
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: ecommerce_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - node.store.allow_mmap=false
    ports:
      - "9250:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Search & Chat Service (Port 9400)
  search-chat-service:
    build: ./services/search-chat-service
    container_name: search-chat-service
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - ELASTICSEARCH_USER=
      - ELASTICSEARCH_PASSWORD=
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-khoidev}
      - DB_PASSWORD=${DB_PASSWORD:-khoicktv}
      - SEARCH_CHAT_DB_NAME=ecommerce_db
    volumes:
      # Mount source files so script changes only need a restart, not a full rebuild.
      # Heavy layers (pip packages, model) stay baked in the image.
      - ./services/search-chat-service/app.py:/app/app.py
      - ./services/search-chat-service/search_engine.py:/app/search_engine.py
      - ./services/search-chat-service/chatbot_agent.py:/app/chatbot_agent.py
      - ./services/search-chat-service/data_cronjob.py:/app/data_cronjob.py
      - ./services/search-chat-service/ingest_data.py:/app/ingest_data.py
    ports:
      - "9400:5000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ecommerce-service:
        condition: service_started
    networks:
      - ecommerce-network
    restart: on-failure

  # ==================== FRONTEND APPLICATIONS ====================

  # Ecommerce UI (Port 3000)
  # ecommerce-ui:
