version: "3.9"

services:
  # ==================== INFRASTRUCTURE ====================

  # PostgreSQL Database (4 databases)
  postgres:
    build: ./infrastructure/database
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-khoidev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-khoicktv}
      POSTGRES_DB: postgres
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-khoidev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka Broker
  kafka:
    image: apache/kafka:4.2.0
    container_name: ecommerce_kafka
    user: root
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka Topic Initialization
  kafka-init:
    image: apache/kafka:4.2.0
    container_name: ecommerce_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/init-kafka.sh:/tmp/init-kafka.sh
    command: ["/bin/bash", "-c", "tr -d '\\r' < /tmp/init-kafka.sh > /tmp/init-kafka-clean.sh && /bin/bash /tmp/init-kafka-clean.sh"]
    networks:
      - ecommerce-network

  # Kafka UI (Optional - for monitoring)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecommerce_kafka_ui
    ports:
      - "9280:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "ecommerce-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      - kafka
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ==================== MICROSERVICES ====================

  # Identity Service (Port 9000)
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile.local
    container_name: identity-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-khoidev}
      DB_PASSWORD: ${DB_PASSWORD:-khoicktv}
      # Kafka
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      # Cloudflare R2
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
    ports:
      - "9000:9000"
    networks:
      - ecommerce-network
    restart: on-failure

  # Back-Office Service (Port 9100)
  back-office-service:
    build:
      context: ./services/back-office-service
      dockerfile: Dockerfile.local
    container_name: back-office-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-khoidev}
      DB_PASSWORD: ${DB_PASSWORD:-khoicktv}
      # Kafka
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      # Cloudflare R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      USER_AVATAR_PUBLIC_BUCKET_URL: ${USER_AVATAR_PUBLIC_BUCKET_URL:-https://pub-954e99f131cf4cc896de1ad360338682.r2.dev}
    ports:
      - "9100:9100"
    networks:
      - ecommerce-network
    restart: on-failure

  # Product Storage Service (Port 9200)
  product-storage-service:
    build:
      context: ./services/product_storage_service
      dockerfile: Dockerfile.local
    container_name: product-storage-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-khoidev}
      DB_PASSWORD: ${DB_PASSWORD:-khoicktv}
      # Kafka
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      # Cloudflare R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      USER_AVATAR_PUBLIC_BUCKET_URL: ${USER_AVATAR_PUBLIC_BUCKET_URL:-https://pub-954e99f131cf4cc896de1ad360338682.r2.dev}
    ports:
      - "9200:9200"
    networks:
      - ecommerce-network
    restart: on-failure

  # Ecommerce Service (Port 9301)
  ecommerce-service:
    build:
      context: ./services/ecommerce-service
      dockerfile: Dockerfile.local
    container_name: ecommerce-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-khoidev}
      DB_PASSWORD: ${DB_PASSWORD:-khoicktv}
      # Kafka
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      # Cloudflare R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      USER_AVATAR_PUBLIC_BUCKET_URL: ${USER_AVATAR_PUBLIC_BUCKET_URL:-https://pub-954e99f131cf4cc896de1ad360338682.r2.dev}
    ports:
      - "9300:9300"
    networks:
      - ecommerce-network
    restart: on-failure

# ==================== NETWORKS & VOLUMES ====================

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
