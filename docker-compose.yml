  # # Back-Office UI (Port 5173)
  # back-office-ui:
  #   build:
  #     context: ./frontend/back-office-ui
  #     dockerfile: Dockerfile
  #   container_name: back-office-ui
  #   depends_on:
  #     - identity-service
  #     - back-office-service
  #     - product-storage-service
  #     - ecommerce-service
  #   ports:
  #     - "5173:80"
  #   networks:
  #     - ecommerce-network
  #   restart: unless-stopped

# ==================== NETWORKS & VOLUMES ====================

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  elasticsearch_data:
    driver: local
  kafka_data:
    driver: local
